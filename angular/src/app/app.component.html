<div class="min-h-screen bg-gray-100 flex flex-col">
  <!-- Header -->
  <app-header />

  <!-- Main Content Area with Mobile Responsive Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar - Hidden on mobile, shown as slide-out menu or above main content -->
    <div class="hidden lg:block">
      <app-sidebar />
    </div>

    <!-- Mobile Sidebar Toggle (shown only on mobile) -->
    <div class="lg:hidden fixed top-20 left-4 z-10">
      <button
        class="bg-white p-2 rounded-lg shadow-md border border-gray-200 hover:bg-gray-50"
        title="Toggle filters"
      >
        <svg
          class="w-5 h-5 text-gray-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.414A1 1 0 013 6.707V4z"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Main Task List - Full width on mobile, reduced width on desktop -->
    <div class="flex-1 lg:flex-none lg:flex-1">
      <app-task-list />
    </div>
  </div>
</div>
