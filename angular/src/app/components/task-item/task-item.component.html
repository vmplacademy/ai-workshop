<div
  class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 hover:shadow-md transition-shadow duration-200"
>
  <div class="flex items-start justify-between">
    <!-- Task Content -->
    <div class="flex-1 min-w-0">
      <!-- Task Name and Status -->
      <div class="flex items-center space-x-3 mb-2">
        <!-- Status Toggle Button -->
        <button
          (click)="onStatusToggle()"
          class="flex-shrink-0 w-5 h-5 rounded-full border-2 transition-all duration-200 hover:scale-110"
          [class]="
            task.status === 'DONE'
              ? 'bg-green-500 border-green-500'
              : 'border-gray-300 hover:border-gray-400'
          "
        >
          @if (task.status === "DONE") {
            <svg
              class="w-3 h-3 text-white m-0.5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                clip-rule="evenodd"
              ></path>
            </svg>
          }
        </button>

        <!-- Task Name -->
        <h3
          class="text-lg font-medium transition-all duration-200"
          [class]="
            task.status === 'DONE'
              ? 'text-gray-500 line-through'
              : 'text-gray-900'
          "
        >
          {{ task.taskName }}
        </h3>

        <!-- Status Badge -->
        <span
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
          [class]="
            getStatusConfig(task.status).bgColor +
            ' ' +
            getStatusConfig(task.status).textColor
          "
        >
          <div
            class="w-1.5 h-1.5 rounded-full mr-1"
            [class]="getStatusConfig(task.status).dotColor"
          ></div>
          {{ getStatusConfig(task.status).label }}
        </span>
      </div>

      <!-- Task Description -->
      @if (task.description) {
        <p class="text-gray-600 text-sm mb-3 line-clamp-2">
          {{ task.description }}
        </p>
      }

      <!-- Due Date -->
      <div class="flex items-center text-sm">
        <svg
          class="w-4 h-4 mr-1.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          ></path>
        </svg>
        <span [class]="getDueDateColor(task.dueDate)">
          {{ formatDate(task.dueDate) }}
        </span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center space-x-2 ml-4">
      <!-- Edit Button -->
      <button
        (click)="onEdit()"
        class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors duration-200"
        title="Edit task"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          ></path>
        </svg>
      </button>

      <!-- Delete Button -->
      <button
        (click)="onDelete()"
        class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200"
        title="Delete task"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
