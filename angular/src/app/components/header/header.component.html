<header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
  <div class="flex items-center justify-between">
    <!-- Logo and Title - Left Side -->
    <div class="flex items-center space-x-3">
      <div
        class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"
      >
        <span class="text-white font-bold text-sm">TD</span>
      </div>
      <h1 class="text-xl font-semibold text-gray-900">ToDo List</h1>
    </div>

    <!-- Add Task Button - Right Side -->
    <button
      (click)="onAddTask()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center space-x-2"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4"
        ></path>
      </svg>
      <span>Add Task</span>
    </button>
  </div>
</header>
