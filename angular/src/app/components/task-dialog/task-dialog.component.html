<div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-auto">
  <!-- Dialog Header -->
  <div class="flex items-center justify-between p-6 border-b border-gray-200">
    <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
    <button 
      (click)="onCancel()"
      class="text-gray-400 hover:text-gray-600 transition-colors duration-200"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Dialog Content -->
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="p-6">
    <!-- Task Name -->
    <div class="mb-4">
      <label for="taskName" class="block text-sm font-medium text-gray-700 mb-1">
        Task Name *
      </label>
      <input
        type="text"
        id="taskName"
        formControlName="taskName"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
        [class.border-red-500]="getFieldError('taskName')"
        placeholder="Enter task name..."
      >
      @if (getFieldError('taskName')) {
        <p class="mt-1 text-sm text-red-600">{{ getFieldError('taskName') }}</p>
      }
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
        Description
      </label>
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200 resize-none"
        [class.border-red-500]="getFieldError('description')"
        placeholder="Enter task description..."
      ></textarea>
      @if (getFieldError('description')) {
        <p class="mt-1 text-sm text-red-600">{{ getFieldError('description') }}</p>
      }
    </div>

    <!-- Status and Due Date Row -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <!-- Status -->
      <div>
        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">
          Status *
        </label>
        <select
          id="status"
          formControlName="status"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
          [class.border-red-500]="getFieldError('status')"
        >
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (getFieldError('status')) {
          <p class="mt-1 text-sm text-red-600">{{ getFieldError('status') }}</p>
        }
      </div>

      <!-- Due Date -->
      <div>
        <label for="dueDate" class="block text-sm font-medium text-gray-700 mb-1">
          Due Date *
        </label>
        <input
          type="date"
          id="dueDate"
          formControlName="dueDate"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
          [class.border-red-500]="getFieldError('dueDate')"
        >
        @if (getFieldError('dueDate')) {
          <p class="mt-1 text-sm text-red-600">{{ getFieldError('dueDate') }}</p>
        }
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:ring-2 focus:ring-gray-500 focus:border-gray-500 transition-colors duration-200"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="taskForm.invalid"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
      >
        {{ submitButtonText }}
      </button>
    </div>
  </form>
</div>
